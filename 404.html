<!DOCTYPE html>
<html lang="en">
<head>
  <title>404 — Eyekonika</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;1,100;1,200;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --p:      #60a5fa;
      --p-dim:  rgba(96,165,250,0.35);
      --w:      rgba(255,255,255,0.93);
      --w-dim:  rgba(255,255,255,0.38);
      --dark:   #030712;
      --ease:   cubic-bezier(0.76,0,0.24,1);
      --ease-out: cubic-bezier(0.16,1,0.3,1);
      --font:   'Poppins', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--w);
      font-family: var(--font);
      overflow: hidden;
    }

    /* Grain */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 9999;
    }

    /* Layout */
    .page {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(29,78,216,0.18) 0%,
        rgba(96,165,250,0.06) 40%,
        transparent 70%);
      filter: blur(40px);
      animation: orbDrift var(--dur, 20s) ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes orbDrift {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(30px,-40px) scale(1.1); }
      66%      { transform: translate(-20px,30px) scale(0.9); }
    }

    /* Geo elements */
    .geo-cross {
      position: absolute; opacity: 0.18;
    }
    .geo-cross::before, .geo-cross::after {
      content: ''; position: absolute; background: var(--p-dim);
    }
    .geo-cross::before { width: 1px; height: 100%; left: 50%; top: 0; }
    .geo-cross::after  { height: 1px; width: 100%; top: 50%; left: 0; }

    .geo-bracket {
      position: absolute;
      width: 40px; height: 40px;
      opacity: 0.3;
    }
    .geo-bracket::before, .geo-bracket::after {
      content: ''; position: absolute; background: var(--p);
    }
    .geo-bracket.tl::before { width: 100%; height: 1px; top: 0; left: 0; }
    .geo-bracket.tl::after  { width: 1px; height: 100%; top: 0; left: 0; }
    .geo-bracket.br::before { width: 100%; height: 1px; bottom: 0; top: auto; right: 0; left: auto; }
    .geo-bracket.br::after  { width: 1px; height: 100%; bottom: 0; top: auto; right: 0; left: auto; }

    .geo-line-h {
      position: absolute; height: 1px;
      background: linear-gradient(90deg,
        transparent 0%, var(--p-dim) 30%,
        rgba(255,255,255,0.15) 50%, var(--p-dim) 70%, transparent 100%);
      opacity: 0.5;
    }

    /* Content */
    .content {
      position: relative; z-index: 2;
      text-align: center;
      display: flex; flex-direction: column;
      align-items: center; gap: 1.5rem;
      animation: fadeUp 1.2s var(--ease-out) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .number {
      font-size: clamp(6rem, 18vw, 14rem);
      font-weight: 100;
      letter-spacing: -0.05em;
      line-height: 1;
      color: var(--w);
      animation: fadeUp 1.2s var(--ease-out) 0.1s both;
    }
    .number span { color: var(--p); font-style: italic; }

    .rule {
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--p-dim), transparent);
      animation: ruleGrow 1.8s var(--ease) 0.6s both;
    }
    @keyframes ruleGrow {
      from { width: 0; }
      to   { width: 120px; }
    }

    .message {
      font-size: clamp(0.75rem, 1.5vw, 0.9rem);
      font-weight: 300;
      color: var(--w-dim);
      letter-spacing: 0.06em;
      line-height: 1.9;
      max-width: 320px;
      animation: fadeUp 1.2s var(--ease-out) 0.5s both;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      margin-top: 0.5rem;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--w-dim);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.4s ease, border-color 0.4s ease;
      animation: fadeUp 1.2s var(--ease-out) 0.8s both;
    }
    .home-link svg {
      width: 14px; height: 14px;
      transition: transform 0.4s var(--ease);
    }
    .home-link:hover { color: var(--p); border-bottom-color: var(--p-dim); }
    .home-link:hover svg { transform: translateX(-4px); }

    /* Cursor glow */
    .cursor-glow {
      position: fixed; width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(96,165,250,0.05) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      transform: translate(-50%,-50%);
      will-change: left, top;
    }

    @media (max-width: 600px) {
      .number { letter-spacing: -0.03em; }
    }
  </style>
</head>
<body>

  <div class="cursor-glow" id="cursor-glow"></div>

  <div class="page">

    <!-- Ambient -->
    <div class="orb" style="width:700px;height:700px;top:50%;left:50%;transform:translate(-50%,-50%);--dur:30s;opacity:0.4;"></div>
    <div class="orb" style="width:350px;height:350px;top:10%;right:5%;--dur:22s;opacity:0.3;"></div>

    <!-- Geo -->
    <div class="geo-cross" style="width:55px;height:55px;top:18%;left:8%;"></div>
    <div class="geo-cross" style="width:35px;height:35px;bottom:22%;right:10%;"></div>
    <div class="geo-bracket tl" style="top:20%;left:20%;"></div>
    <div class="geo-bracket br" style="bottom:20%;right:20%;"></div>
    <div class="geo-line-h" style="width:180px;top:28%;left:50%;transform:translateX(-50%);"></div>
    <div class="geo-line-h" style="width:100px;bottom:28%;left:50%;transform:translateX(-50%);"></div>

    <!-- Content -->
    <div class="content">
      <p class="number"><span>4</span>0<span>4</span></p>
      <div class="rule"></div>
      <p class="message">This page doesn't exist — or it moved.<br>Everything else is right where you left it.</p>
      <a href="index.html" class="home-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Eyekonika
      </a>
    </div>

  </div>

  <script>
    // Cursor glow
    var glow = document.getElementById('cursor-glow');
    var gx = 0, gy = 0, mx = 0, my = 0;
    document.addEventListener('mousemove', function(e) { mx = e.clientX; my = e.clientY; });
    (function tick() {
      gx += (mx - gx) * 0.08;
      gy += (my - gy) * 0.08;
      if (glow) { glow.style.left = gx + 'px'; glow.style.top = gy + 'px'; }
      requestAnimationFrame(tick);
    })();
  </script>

</body>
</html>
