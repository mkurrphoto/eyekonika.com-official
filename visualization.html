<!DOCTYPE html>
<html lang="en">
<head>
  <title>3D Visualization — Eyekonika</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #05080f;
      --fg:     #ede8df;
      --muted:  #6a7080;
      --accent: #c4a35a;
      --crystal:#a8c8ff;
      --font-display: "Bebas Neue", sans-serif;
      --font-mono:    "DM Mono", monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      overflow: hidden;
    }

    /* ── Nav ─────────────────────────────────── */
    #site_nav {
      position: fixed;
      top: 2rem; left: 2rem;
      z-index: 10;
    }
    #site_nav a {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.4em;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    #site_nav a:hover { opacity: 1; }
    #site_nav img { height: 34px; width: auto; display: block; }
    #site_nav .back-label {
      font-size: 0.48rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Title ───────────────────────────────── */
    #title_block {
      position: fixed;
      top: 2rem; right: 2rem;
      z-index: 10;
      text-align: right;
      pointer-events: none;
    }
    #title_block h1 {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 2.5vw, 2.2rem);
      letter-spacing: 0.06em;
      line-height: 1.05;
    }
    #title_block p {
      font-size: 0.5rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.4em;
    }

    /* ── Loader ──────────────────────────────── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      gap: 1.4rem;
      transition: opacity 0.7s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }

    #loader-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      letter-spacing: 0.08em;
      color: var(--crystal);
    }
    #loader-bar-wrap {
      width: min(20rem, 72vw);
      height: 1px;
      background: rgba(168, 200, 255, 0.15);
      position: relative;
      overflow: hidden;
    }
    #loader-bar {
      position: absolute;
      inset-block: 0;
      left: 0;
      width: 0%;
      background: var(--crystal);
      transition: width 0.15s linear;
    }
    #loader-sub {
      font-size: 0.52rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Hint ────────────────────────────────── */
    #hint {
      position: fixed;
      bottom: 2.2rem;
      left: 50%;
      translate: -50% 0;
      z-index: 10;
      font-size: 0.5rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 1.2s ease;
    }
    #hint.fade { opacity: 0; }

    /* ── Controls ────────────────────────────── */
    #controls {
      position: fixed;
      bottom: 2rem; right: 2rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: flex-end;
    }
    .ctrl-btn {
      padding: 0.4rem 0.85rem;
      border: 1px solid rgba(168, 200, 255, 0.2);
      background: rgba(5, 8, 15, 0.7);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.5rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      backdrop-filter: blur(8px);
    }
    .ctrl-btn:hover, .ctrl-btn.active {
      border-color: var(--crystal);
      color: var(--crystal);
      background: rgba(168, 200, 255, 0.08);
    }

    /* ── Stats ───────────────────────────────── */
    #stats {
      position: fixed;
      bottom: 2rem; left: 2rem;
      z-index: 10;
      font-size: 0.46rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(106, 112, 128, 0.6);
      pointer-events: none;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <nav id="site_nav">
    <a href="/">
      <img src="images/logo-index-transparent.png" alt="Eyekonika" />
      <span class="back-label">&#8592; Back to Home</span>
    </a>
  </nav>

  <div id="title_block">
    <h1>St. Tikhon&rsquo;s<br>Monastery</h1>
    <p>Subsurface Laser Engraving Preview</p>
  </div>

  <div id="loader">
    <div id="loader-title">Building Crystal</div>
    <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
    <div id="loader-sub">Parsing geometry&hellip;</div>
  </div>

  <div id="hint">Drag to rotate &middot; Scroll to zoom</div>

  <div id="controls">
    <button class="ctrl-btn" id="btn_reset">Reset View</button>
    <button class="ctrl-btn active" id="btn_auto">Auto-Rotate: On</button>
    <button class="ctrl-btn" id="btn_edges">Hide Edges</button>
  </div>

  <div id="stats"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    /*
     * Render order for points-inside-glass effect:
     *   0 — opaque scene (floor, base)
     *   1 — crystal back faces  (glass behind the engraving)
     *   2 — point cloud         (the engraving itself)
     *   3 — crystal front faces (glass in front of the engraving)
     *   4 — edge lines
     *
     * No MeshPhysicalMaterial transmission — that render pass captures the
     * scene before AdditiveBlending points are composited, making them vanish.
     */
    import * as THREE          from 'three';
    import { OBJLoader }       from 'three/addons/loaders/OBJLoader.js';
    import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const CW = 6, CD = 6, CH = 10;  // crystal width × depth × height

    const loaderEl = document.getElementById('loader');
    const barEl    = document.getElementById('loader-bar');
    const subEl    = document.getElementById('loader-sub');
    const hintEl   = document.getElementById('hint');
    const statsEl  = document.getElementById('stats');
    const btnReset = document.getElementById('btn_reset');
    const btnAuto  = document.getElementById('btn_auto');
    const btnEdges = document.getElementById('btn_edges');

    // ── Renderer ──────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace   = THREE.SRGBColorSpace;
    renderer.toneMapping        = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // ── Scene ─────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05080f);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    pmrem.dispose();

    // ── Camera ────────────────────────────────────────────
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, CH * 0.5, CH * 2.0);

    // ── Controls ──────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, CH * 0.5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance   = 4;
    controls.maxDistance   = 80;
    controls.maxPolarAngle = Math.PI * 0.88;
    controls.update();

    const defaultCamPos = camera.position.clone();
    const defaultTarget = controls.target.clone();

    // ── Lights ────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0x0a1020, 3));

    const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
    keyLight.position.set(5, 18, 10);
    scene.add(keyLight);

    // Blue back-light — classic crystal display pedestal look
    const backLight = new THREE.PointLight(0x2255ff, 8, 40);
    backLight.position.set(0, -1, -12);
    scene.add(backLight);

    const rimLight = new THREE.PointLight(0x6699ff, 3, 25);
    rimLight.position.set(-10, CH, -5);
    scene.add(rimLight);

    // ── Scene group (rotates together) ────────────────────
    const crystalGroup = new THREE.Group();
    scene.add(crystalGroup);

    // ── Floor ─────────────────────────────────────────────
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshStandardMaterial({ color: 0x060a14, roughness: 0.9, metalness: 0.05 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.42;
    scene.add(floor);

    // ── Crystal glass — split into back + front faces ─────
    // Back faces render BEFORE points (renderOrder 1)
    // Front faces render AFTER points (renderOrder 3)
    // This creates the illusion of points floating inside glass.
    function makeGlassMat(side) {
      return new THREE.MeshPhysicalMaterial({
        color:           0xc0d8ff,
        roughness:       0.01,
        metalness:       0.0,
        transparent:     true,
        opacity:         side === THREE.BackSide ? 0.07 : 0.13,
        side,
        envMapIntensity: 2.5,
        depthWrite:      false,
      });
    }

    const BOX = new THREE.BoxGeometry(CW, CH, CD);

    const crystalBack = new THREE.Mesh(BOX, makeGlassMat(THREE.BackSide));
    crystalBack.position.y  = CH / 2;
    crystalBack.renderOrder = 1;
    crystalGroup.add(crystalBack);

    const crystalFront = new THREE.Mesh(BOX, makeGlassMat(THREE.FrontSide));
    crystalFront.position.y  = CH / 2;
    crystalFront.renderOrder = 3;
    crystalGroup.add(crystalFront);

    // ── Crystal edges ─────────────────────────────────────
    const edgeLines = new THREE.LineSegments(
      new THREE.EdgesGeometry(BOX),
      new THREE.LineBasicMaterial({ color: 0x99ccff, transparent: true, opacity: 0.6 })
    );
    edgeLines.position.y  = CH / 2;
    edgeLines.renderOrder = 4;
    crystalGroup.add(edgeLines);

    // ── Pedestal ──────────────────────────────────────────
    const base = new THREE.Mesh(
      new THREE.BoxGeometry(CW + 0.8, 0.4, CD + 0.8),
      new THREE.MeshStandardMaterial({ color: 0x181c28, roughness: 0.3, metalness: 0.6 })
    );
    base.position.y = -0.2;
    crystalGroup.add(base);

    // ── Glow sprite ───────────────────────────────────────
    function makeGlowTex() {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0,    'rgba(255,255,255,1)');
      g.addColorStop(0.12, 'rgba(210,230,255,0.95)');
      g.addColorStop(0.35, 'rgba(130,185,255,0.55)');
      g.addColorStop(1,    'rgba(50,110,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    // ── Load OBJ and build point cloud ────────────────────
    barEl.style.width = '5%';
    subEl.textContent = 'Loading geometry…';

    new OBJLoader().load(
      'models/sttikhons/FinalDesign.obj',
      (obj) => {
        barEl.style.width = '72%';
        subEl.textContent = 'Building point cloud…';

        // Collect all vertex positions
        obj.updateMatrixWorld(true);
        const raw = [];
        obj.traverse(child => {
          if (!child.isMesh) return;
          const attr = child.geometry.attributes.position;
          if (!attr) return;
          const v = new THREE.Vector3();
          for (let i = 0; i < attr.count; i++) {
            v.fromBufferAttribute(attr, i).applyMatrix4(child.matrixWorld);
            raw.push(v.x, v.y, v.z);
          }
        });

        // Subsample to ≤ 220k points
        const MAX = 220000;
        const rawCount = raw.length / 3;
        let pos;
        if (rawCount <= MAX) {
          pos = new Float32Array(raw);
        } else {
          const step = Math.ceil(rawCount / MAX);
          const out  = [];
          for (let i = 0; i < raw.length; i += step * 3)
            out.push(raw[i], raw[i+1], raw[i+2]);
          pos = new Float32Array(out);
        }

        // Compute bounding box, scale to fit 84% of crystal interior
        const tmpGeo = new THREE.BufferGeometry();
        tmpGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        tmpGeo.computeBoundingBox();
        const bb  = tmpGeo.boundingBox;
        const sz  = new THREE.Vector3(); bb.getSize(sz);
        const ctr = new THREE.Vector3(); bb.getCenter(ctr);
        const fill  = 0.84;
        const scale = Math.min((CW * fill) / sz.x, (CH * fill) / sz.y, (CD * fill) / sz.z);

        // Transform points into crystal space
        const n = pos.length / 3;
        const finalPos = new Float32Array(pos.length);
        const colors   = new Float32Array(pos.length);

        for (let i = 0; i < n; i++) {
          const x = (pos[i*3]   - ctr.x) * scale;
          const y = (pos[i*3+1] - ctr.y) * scale + CH / 2;
          const z = (pos[i*3+2] - ctr.z) * scale;
          finalPos[i*3] = x; finalPos[i*3+1] = y; finalPos[i*3+2] = z;

          // Brightness: slight random variation + centre-bright falloff
          const b  = 0.75 + Math.random() * 0.25;
          const yN = (y - CH / 2) / (CH / 2);             // –1 to +1
          const cx = x / (CW / 2);                         // –1 to +1
          const boost = 0.15 * Math.max(0, 1 - Math.sqrt(yN*yN + cx*cx));
          colors[i*3]   = b * (0.70 + boost);  // R (warm-ish)
          colors[i*3+1] = b * (0.86 + boost);  // G
          colors[i*3+2] = b * 1.00;            // B (full)
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(finalPos, 3));
        geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

        const points = new THREE.Points(geo, new THREE.PointsMaterial({
          size:            0.09,
          sizeAttenuation: true,
          map:             makeGlowTex(),
          vertexColors:    true,
          transparent:     true,
          opacity:         0.92,
          depthWrite:      false,
          blending:        THREE.AdditiveBlending,
          alphaTest:       0.005,
        }));
        points.renderOrder = 2;   // between back glass (1) and front glass (3)
        crystalGroup.add(points);

        barEl.style.width  = '100%';
        statsEl.textContent = `${n.toLocaleString()} engraving points`;
        setTimeout(() => {
          loaderEl.classList.add('hidden');
          setTimeout(() => hintEl.classList.add('fade'), 5000);
        }, 350);
      },
      (xhr) => {
        if (xhr.total > 0) {
          const p = 5 + (xhr.loaded / xhr.total) * 65;
          barEl.style.width = p.toFixed(0) + '%';
          subEl.textContent = `Loading geometry… ${p.toFixed(0)}%`;
        }
      },
      (err) => { console.error(err); subEl.textContent = 'Error loading model.'; }
    );

    // ── Button handlers ───────────────────────────────────
    let autoRotate = true, resumeTimer = null;

    controls.addEventListener('start', () => {
      autoRotate = false; clearTimeout(resumeTimer);
      btnAuto.textContent = 'Auto-Rotate: Off';
      btnAuto.classList.remove('active');
    });
    controls.addEventListener('end', () => {
      resumeTimer = setTimeout(() => {
        autoRotate = true;
        btnAuto.textContent = 'Auto-Rotate: On';
        btnAuto.classList.add('active');
      }, 4000);
    });
    btnAuto.addEventListener('click', () => {
      autoRotate = !autoRotate; clearTimeout(resumeTimer);
      btnAuto.textContent = autoRotate ? 'Auto-Rotate: On' : 'Auto-Rotate: Off';
      btnAuto.classList.toggle('active', autoRotate);
    });

    let edgesVisible = true;
    btnEdges.addEventListener('click', () => {
      edgesVisible = !edgesVisible;
      edgeLines.visible = edgesVisible;
      btnEdges.textContent = edgesVisible ? 'Hide Edges' : 'Show Edges';
      btnEdges.classList.toggle('active', !edgesVisible);
    });

    btnReset.addEventListener('click', () => {
      camera.position.copy(defaultCamPos);
      controls.target.copy(defaultTarget);
      controls.update();
    });

    // ── Resize ────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Render loop ───────────────────────────────────────
    const clock = new THREE.Clock();
    (function animate() {
      requestAnimationFrame(animate);
      if (autoRotate) crystalGroup.rotation.y += clock.getDelta() * 0.18;
      else clock.getDelta();   // keep clock ticking
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
