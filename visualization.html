<!DOCTYPE html>
<html lang="en">
<head>
  <title>3D Visualization — Eyekonika</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #05080f;
      --fg:     #ede8df;
      --muted:  #6a7080;
      --accent: #c4a35a;
      --crystal:#a8c8ff;
      --font-display: "Bebas Neue", sans-serif;
      --font-mono:    "DM Mono", monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      overflow: hidden;
    }

    /* ── Nav ─────────────────────────────────── */
    #site_nav {
      position: fixed;
      top: 2rem; left: 2rem;
      z-index: 10;
    }
    #site_nav a {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.4em;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    #site_nav a:hover { opacity: 1; }
    #site_nav img { height: 34px; width: auto; display: block; }
    #site_nav .back-label {
      font-size: 0.48rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Title ───────────────────────────────── */
    #title_block {
      position: fixed;
      top: 2rem; right: 2rem;
      z-index: 10;
      text-align: right;
      pointer-events: none;
    }
    #title_block h1 {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 2.5vw, 2.2rem);
      letter-spacing: 0.06em;
      line-height: 1.05;
    }
    #title_block p {
      font-size: 0.5rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.4em;
    }

    /* ── Loader ──────────────────────────────── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      gap: 1.4rem;
      transition: opacity 0.7s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }

    #loader-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      letter-spacing: 0.08em;
      color: var(--crystal);
    }
    #loader-bar-wrap {
      width: min(20rem, 72vw);
      height: 1px;
      background: rgba(168, 200, 255, 0.15);
      position: relative;
      overflow: hidden;
    }
    #loader-bar {
      position: absolute;
      inset-block: 0;
      left: 0;
      width: 0%;
      background: var(--crystal);
      transition: width 0.15s linear;
    }
    #loader-sub {
      font-size: 0.52rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Hint ────────────────────────────────── */
    #hint {
      position: fixed;
      bottom: 2.2rem;
      left: 50%;
      translate: -50% 0;
      z-index: 10;
      font-size: 0.5rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 1.2s ease;
    }
    #hint.fade { opacity: 0; }

    /* ── Controls ────────────────────────────── */
    #controls {
      position: fixed;
      bottom: 2rem; right: 2rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: flex-end;
    }
    .ctrl-btn {
      padding: 0.4rem 0.85rem;
      border: 1px solid rgba(168, 200, 255, 0.2);
      background: rgba(5, 8, 15, 0.7);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.5rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      backdrop-filter: blur(8px);
    }
    .ctrl-btn:hover, .ctrl-btn.active {
      border-color: var(--crystal);
      color: var(--crystal);
      background: rgba(168, 200, 255, 0.08);
    }

    /* ── Stats ───────────────────────────────── */
    #stats {
      position: fixed;
      bottom: 2rem; left: 2rem;
      z-index: 10;
      font-size: 0.46rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(106, 112, 128, 0.6);
      pointer-events: none;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <nav id="site_nav">
    <a href="/">
      <img src="images/logo-index-transparent.png" alt="Eyekonika" />
      <span class="back-label">&#8592; Back to Home</span>
    </a>
  </nav>

  <div id="title_block">
    <h1>St. Tikhon&rsquo;s<br>Monastery</h1>
    <p>Subsurface Laser Engraving Preview</p>
  </div>

  <div id="loader">
    <div id="loader-title">Building Crystal</div>
    <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
    <div id="loader-sub">Parsing geometry&hellip;</div>
  </div>

  <div id="hint">Drag to rotate &middot; Scroll to zoom</div>

  <div id="controls">
    <button class="ctrl-btn" id="btn_reset">Reset View</button>
    <button class="ctrl-btn active" id="btn_auto">Auto-Rotate: On</button>
    <button class="ctrl-btn" id="btn_edges">Hide Edges</button>
  </div>

  <div id="stats"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE               from 'three';
    import { OBJLoader }            from 'three/addons/loaders/OBJLoader.js';
    import { OrbitControls }        from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment }      from 'three/addons/environments/RoomEnvironment.js';

    // ── Crystal dimensions (width : depth : height) ──────
    const CW = 6, CD = 6, CH = 10;   // 6 × 6 × 10

    // ── DOM refs ──────────────────────────────────────────
    const loaderEl  = document.getElementById('loader');
    const barEl     = document.getElementById('loader-bar');
    const subEl     = document.getElementById('loader-sub');
    const hintEl    = document.getElementById('hint');
    const statsEl   = document.getElementById('stats');
    const btnReset  = document.getElementById('btn_reset');
    const btnAuto   = document.getElementById('btn_auto');
    const btnEdges  = document.getElementById('btn_edges');

    // ── Renderer ──────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace  = THREE.SRGBColorSpace;
    renderer.toneMapping       = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // ── Scene ─────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05080f);

    // Environment map (gives crystal nice reflections)
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    pmrem.dispose();

    // ── Camera ────────────────────────────────────────────
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, CH * 0.5, CH * 1.9);

    // ── Controls ──────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, CH * 0.5, 0);
    controls.enableDamping  = true;
    controls.dampingFactor  = 0.05;
    controls.minDistance    = 4;
    controls.maxDistance    = 80;
    controls.maxPolarAngle  = Math.PI * 0.88;
    controls.update();

    const defaultCamPos = camera.position.clone();
    const defaultTarget = controls.target.clone();

    // ── Lights ────────────────────────────────────────────
    // Dim ambient — we want the glowing points to do the work
    scene.add(new THREE.AmbientLight(0x0a1020, 2));

    // Top soft key (for crystal reflections)
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.6);
    keyLight.position.set(4, 18, 8);
    scene.add(keyLight);

    // Back-blue light — simulates the classic crystal display pedestal
    const backLight = new THREE.PointLight(0x3366ff, 6, 30);
    backLight.position.set(0, -2, -10);
    scene.add(backLight);

    // Subtle rim
    const rimLight = new THREE.PointLight(0x88aaff, 2, 20);
    rimLight.position.set(-8, CH, -6);
    scene.add(rimLight);

    // ── Group that holds everything (auto-rotate on this) ─
    const crystalGroup = new THREE.Group();
    crystalGroup.position.set(0, 0, 0);
    scene.add(crystalGroup);

    // ── Glass crystal box ─────────────────────────────────
    const glassMat = new THREE.MeshPhysicalMaterial({
      color:            0xc8dcff,
      transmission:     0.96,
      roughness:        0.02,
      metalness:        0,
      ior:              1.52,
      thickness:        Math.min(CW, CD),
      transparent:      true,
      opacity:          0.22,
      side:             THREE.DoubleSide,
      envMapIntensity:  2.0,
      attenuationColor: new THREE.Color(0xb8d4ff),
      attenuationDistance: 8,
    });

    const crystalMesh = new THREE.Mesh(
      new THREE.BoxGeometry(CW, CH, CD),
      glassMat
    );
    crystalMesh.position.y = CH / 2;
    crystalGroup.add(crystalMesh);

    // Glowing edges
    const edgesGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(CW, CH, CD));
    const edgesMat = new THREE.LineBasicMaterial({
      color:       0x88bbff,
      transparent: true,
      opacity:     0.55,
    });
    const edgeLines = new THREE.LineSegments(edgesGeo, edgesMat);
    edgeLines.position.y = CH / 2;
    crystalGroup.add(edgeLines);

    // ── Pedestal / base ───────────────────────────────────
    const baseMat = new THREE.MeshStandardMaterial({
      color:     0x181c28,
      roughness: 0.3,
      metalness: 0.6,
    });
    const base = new THREE.Mesh(new THREE.BoxGeometry(CW + 0.8, 0.4, CD + 0.8), baseMat);
    base.position.y = -0.2;
    crystalGroup.add(base);

    // ── Floor plane (subtle reflection) ───────────────────
    const floorMat = new THREE.MeshStandardMaterial({
      color:     0x060a14,
      roughness: 0.8,
      metalness: 0.1,
    });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.42;
    scene.add(floor);

    // ── Glow sprite texture ───────────────────────────────
    function makeGlowTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0,    'rgba(255, 255, 255, 1)');
      g.addColorStop(0.15, 'rgba(200, 225, 255, 0.9)');
      g.addColorStop(0.4,  'rgba(130, 185, 255, 0.5)');
      g.addColorStop(1,    'rgba(60,  120, 255, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }
    const glowTex = makeGlowTexture();

    // ── Load OBJ → point cloud ────────────────────────────
    subEl.textContent = 'Parsing geometry…';
    barEl.style.width = '5%';

    const objLoader = new OBJLoader();
    objLoader.load(
      'models/sttikhons/FinalDesign.obj',
      (obj) => {
        barEl.style.width = '70%';
        subEl.textContent = 'Building point cloud…';

        // --- Collect all vertex positions in world space ---
        // Apply the object's own transforms (there shouldn't be any from OBJ
        // but traverse handles nested groups)
        obj.updateMatrixWorld(true);

        const rawPos = [];
        obj.traverse(child => {
          if (!child.isMesh) return;
          const pos = child.geometry.attributes.position;
          if (!pos) return;
          const mat = child.matrixWorld;
          const v   = new THREE.Vector3();
          for (let i = 0; i < pos.count; i++) {
            v.fromBufferAttribute(pos, i).applyMatrix4(mat);
            rawPos.push(v.x, v.y, v.z);
          }
        });

        const rawCount = rawPos.length / 3;

        // --- Subsample to ≤ 200k points for performance ---
        const MAX_PTS = 200000;
        let positions;
        if (rawCount <= MAX_PTS) {
          positions = new Float32Array(rawPos);
        } else {
          const step = Math.ceil(rawCount / MAX_PTS);
          const out  = [];
          for (let i = 0; i < rawPos.length; i += step * 3) {
            out.push(rawPos[i], rawPos[i + 1], rawPos[i + 2]);
          }
          positions = new Float32Array(out);
        }

        const ptCount = positions.length / 3;

        // --- Compute bounding box and center/scale to crystal ---
        const tempGeo = new THREE.BufferGeometry();
        tempGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        tempGeo.computeBoundingBox();
        const bb  = tempGeo.boundingBox;
        const sz  = new THREE.Vector3();
        bb.getSize(sz);
        const ctr = new THREE.Vector3();
        bb.getCenter(ctr);

        // Scale so the model fills ~82% of the crystal interior
        const fillRatio = 0.82;
        const scaleX = (CW * fillRatio) / sz.x;
        const scaleY = (CH * fillRatio) / sz.y;
        const scaleZ = (CD * fillRatio) / sz.z;
        const scale  = Math.min(scaleX, scaleY, scaleZ);

        // Apply centering + scale to every point
        const final = new Float32Array(positions.length);
        for (let i = 0; i < positions.length; i += 3) {
          final[i]     = (positions[i]     - ctr.x) * scale;
          final[i + 1] = (positions[i + 1] - ctr.y) * scale + CH / 2;
          final[i + 2] = (positions[i + 2] - ctr.z) * scale;
        }

        // --- Per-point colour: slight brightness variation ---
        const colors = new Float32Array(ptCount * 3);
        for (let i = 0; i < ptCount; i++) {
          const b = 0.72 + Math.random() * 0.28;   // 0.72 – 1.0
          // Slight blue-white tint, brighter toward centre (approx by Y)
          const y = (final[i * 3 + 1] - CH / 2) / (CH / 2);  // –1 to +1
          const extra = 0.12 * (1 - Math.abs(y));
          colors[i * 3]     = b * (0.72 + extra);   // R
          colors[i * 3 + 1] = b * (0.85 + extra);   // G
          colors[i * 3 + 2] = b * 1.0;              // B  (always full)
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(final, 3));
        geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

        const mat = new THREE.PointsMaterial({
          size:             0.055,
          sizeAttenuation:  true,
          map:              glowTex,
          vertexColors:     true,
          transparent:      true,
          opacity:          0.88,
          depthWrite:       false,
          blending:         THREE.AdditiveBlending,
          alphaTest:        0.01,
        });

        const points = new THREE.Points(geo, mat);
        crystalGroup.add(points);

        barEl.style.width  = '100%';
        subEl.textContent  = 'Ready';
        statsEl.textContent = `${ptCount.toLocaleString()} engraving points`;

        setTimeout(() => {
          loaderEl.classList.add('hidden');
          setTimeout(() => hintEl.classList.add('fade'), 5000);
        }, 400);
      },
      (xhr) => {
        if (xhr.total > 0) {
          const pct = 5 + (xhr.loaded / xhr.total) * 62;
          barEl.style.width  = pct.toFixed(0) + '%';
          subEl.textContent  = `Loading geometry… ${pct.toFixed(0)}%`;
        }
      },
      (err) => {
        console.error(err);
        subEl.textContent = 'Error loading model.';
      }
    );

    // ── Auto-rotate ───────────────────────────────────────
    let autoRotate   = true;
    let resumeTimer  = null;

    controls.addEventListener('start', () => {
      autoRotate = false;
      clearTimeout(resumeTimer);
      btnAuto.textContent = 'Auto-Rotate: Off';
      btnAuto.classList.remove('active');
    });
    controls.addEventListener('end', () => {
      resumeTimer = setTimeout(() => {
        autoRotate = true;
        btnAuto.textContent = 'Auto-Rotate: On';
        btnAuto.classList.add('active');
      }, 4000);
    });

    btnAuto.addEventListener('click', () => {
      autoRotate = !autoRotate;
      clearTimeout(resumeTimer);
      btnAuto.textContent = autoRotate ? 'Auto-Rotate: On' : 'Auto-Rotate: Off';
      btnAuto.classList.toggle('active', autoRotate);
    });

    // ── Edge toggle ───────────────────────────────────────
    let edgesVisible = true;
    btnEdges.addEventListener('click', () => {
      edgesVisible = !edgesVisible;
      edgeLines.visible = edgesVisible;
      btnEdges.textContent = edgesVisible ? 'Hide Edges' : 'Show Edges';
      btnEdges.classList.toggle('active', !edgesVisible);
    });

    // ── Reset ─────────────────────────────────────────────
    btnReset.addEventListener('click', () => {
      camera.position.copy(defaultCamPos);
      controls.target.copy(defaultTarget);
      controls.update();
    });

    // ── Resize ────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Render loop ───────────────────────────────────────
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (autoRotate) crystalGroup.rotation.y += dt * 0.18;  // ~10°/s
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
