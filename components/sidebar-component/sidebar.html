<script>
(function () {
  if (!window.matchMedia('(max-width: 736px)').matches) return;

  var nav = document.getElementById('mobile-nav');
  if (!nav) return;

  // Show after scrolling past ~70% of the hero (which is min-height: 100vh)
  var threshold = window.innerHeight * 0.7;

  window.addEventListener('scroll', function () {
    nav.classList.toggle('is-visible', window.scrollY > threshold);
  }, { passive: true });
})();
</script>
