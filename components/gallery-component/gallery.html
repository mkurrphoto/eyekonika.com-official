<section id="two" class="gallery-section">

  <div class="gallery-header">
    <p class="gallery-eyebrow">Portfolio</p>
    <h2 class="gallery-title">Our Past Projects</h2>
    <p class="gallery-subtitle">A selection of pieces we've crafted — each one a permanent work of art.</p>
  </div>

  <div class="gallery-stage">
    <div class="container">
      <img src="images/gallery/1.jpg" alt="Past project" class="item item-1">
      <img src="images/gallery/2.jpg" alt="Past project" class="item item-2">
      <img src="images/gallery/3.jpg" alt="Past project" class="item item-3">
    </div>
    <div class="gallery-dots" aria-hidden="true">
      <button class="gallery-dot" data-index="0"></button>
      <button class="gallery-dot" data-index="1"></button>
      <button class="gallery-dot" data-index="2"></button>
    </div>
  </div>

  <div class="gallery-cta">
    <a href="projects.html" class="backImage-btn gallery-more-btn">View All Projects &rarr;</a>
  </div>

</section>

<script>
(function () {
  if (!window.matchMedia('(max-width: 768px)').matches) return;

  var items   = document.querySelectorAll('.gallery-stage .item');
  var dots    = document.querySelectorAll('.gallery-dot');
  var current = 0;

  function goTo(index) {
    items[current].classList.remove('gallery-active');
    dots[current].classList.remove('active');
    current = ((index % items.length) + items.length) % items.length;
    items[current].classList.add('gallery-active');
    dots[current].classList.add('active');
  }

  // Initialise first slide
  goTo(0);

  // Dot buttons
  dots.forEach(function (dot, i) {
    dot.addEventListener('click', function () { goTo(i); });
  });

  // Swipe
  var startX = 0;
  var stage  = document.querySelector('.gallery-stage');

  stage.addEventListener('touchstart', function (e) {
    startX = e.changedTouches[0].screenX;
  }, { passive: true });

  stage.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].screenX - startX;
    if (Math.abs(dx) > 40) goTo(dx < 0 ? current + 1 : current - 1);
  }, { passive: true });
})();
</script>
