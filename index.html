<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eyekonika</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #f0f0f0;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #222;
    }
    header {
      background: #fff;
      padding: 2rem 0 1rem 0;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      font-weight: 700;
    }
    main {
      max-width: 900px;
      margin: 2rem auto;
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    section {
      margin-bottom: 2.5rem;
    }
    h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      font-weight: 600;
      border-left: 4px solid #888;
      padding-left: 0.5em;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .gallery img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      background: #e0e0e0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .content-placeholder {
      background: #fafafa;
      border: 1px dashed #bbb;
      height: 60px;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 1.1rem;
    }
    @media (max-width: 600px) {
      main { padding: 1rem; }
      .gallery img { height: 100px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Eyekonika</h1>
  </header>
  <main>
    <section>
      <h2>Gallery</h2>
      <div class="gallery">
        <img src="images/sample1.jpg" alt="Gallery image 1" />
        <img src="images/sample2.jpg" alt="Gallery image 2" />
        <img src="images/sample3.jpg" alt="Gallery image 3" />
        <img src="images/sample4.jpg" alt="Gallery image 4" />
      </div>
    </section>
    <section>
      <h2>About</h2>
      <div class="content-placeholder">[ Content here ]</div>
    </section>
    <section>
      <h2>Services</h2>
      <div class="content-placeholder">[ Content here ]</div>
    </section>
    <section>
      <h2>Contact</h2>
      <div class="content-placeholder">[ Content here ]</div>
    </section>
  </main>
</body>
</html>
